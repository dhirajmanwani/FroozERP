[package]
name = "froozerp"
version = "1.0.40"
description = "FroozERP desktop application shell"
authors = ["SRT Company"]
edition = "2021"
default-run = "froozerp"
[lib]
name = "froozerp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
