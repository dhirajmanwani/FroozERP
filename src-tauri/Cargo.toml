[package]
name = "froozerp"
version = "1.0.2"
description = "FroozERP desktop application shell"
authors = ["SRT Company"]
edition = "2021"
default-run = "froozerp"

[lib]
name = "froozerp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
