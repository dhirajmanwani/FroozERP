[package]
name = "froozerp"
version = "1.0.74"
description = "FroozERP desktop application shell"
authors = ["SRT Company"]
edition = "2021"
default-run = "froozerp"
[lib]
name = "froozerp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The desktop shell. `default-run` above names it, so it is the *main* bundle binary.
[[bin]]
name = "froozerp"
path = "src/main.rs"

# Maintainer-local activation signing CLI (Stage 3). NOT part of the shipped bundle.
#
# Two things keep it out of the NSIS installer, and both are load-bearing:
#
#   1. `required-features`. tauri-cli's `get_binaries`
#      (tauri-cli-2.11.2/src/interface/rust.rs:944-952) skips a declared `[[bin]]` whose required
#      features are not present in the feature list passed on the build command line. Cargo's
#      *default* features are not in that list, so this bin is invisible to the bundler while
#      still being built by `cargo build` / `cargo test`.
#   2. The source lives in `tools/`, not `src/bin/`. `get_binaries` also scans `src/bin`
#      (rust.rs:963-1001) and re-adds anything found there that is not already in the binary list
#      — which is exactly what a `required-features` skip leaves behind. tauri-bundler then
#      packages every non-main binary into the installer
#      (tauri-bundler-2.9.2/src/bundle/windows/nsis/mod.rs:828-839).
#
# `default-run` alone does NOT exclude a binary: it only chooses which one is main.
[[bin]]
name = "sign_activation"
path = "tools/sign_activation.rs"
required-features = ["signing-cli"]

[features]
default = ["signing-cli"]
# Builds the maintainer-local signing CLI and its round-trip test suite. On by default so the
# plain `cargo test --manifest-path src-tauri/Cargo.toml` gate exercises the real signing path.
signing-cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

# The updater and process plugins are desktop-only. The phone app is updated through its store, and
# `tauri-plugin-updater` would otherwise try to install a Windows NSIS feed. Registered in lib.rs
# under `#[cfg(desktop)]` only, and their permissions are desktop-only in capabilities/default.json.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The phone app's cloud-health and authoritative-time probes (src/mobile_gateway.rs), which the Node
# desktop gateway makes with `fetch` on Windows. Not a Windows dependency: the Windows build never
# links it and its behaviour is unchanged. Compiled on the non-shipped Linux/macOS desktop builds
# too, so that `cargo check`/`cargo test` on a Linux machine type-check the code the phone runs;
# the probe is only *used* when `cfg(mobile)`. rustls + bundled webpki roots: no JNI-initialised
# platform verifier on Android, no OpenSSL to cross-compile.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Device identity where there is no CoCreateGuid (Android, iOS, and the non-shipped Linux/macOS
# desktop builds): a random v4 UUID. Windows keeps its CoCreateGuid path in local_db.rs unchanged.
uuid = { version = "1", features = ["v4"] }
