name: Windows updater release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.31"
        required: true
      channel:
        description: "Update channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      publish:
        description: "Publish GitHub release after installed-app verification"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "codex/final-cloud-sync-stabilization"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      FROOZERP_UPDATE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Validate signing secret
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_CONFIGURED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured as a GitHub Actions secret."
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD_CONFIGURED -eq "true") {
            Write-Output "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is configured. Value is not printed."
          } else {
            Write-Output "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured; continuing with the existing unencrypted signing key path."
          }

      - name: Normalize signing key encoding
        shell: pwsh
        run: |
          $key = [string]$env:TAURI_SIGNING_PRIVATE_KEY
          $key = ($key.Trim() -replace '\s', '')
          $padding = (4 - ($key.Length % 4)) % 4
          if ($padding -gt 0) {
            $key = $key + ('=' * $padding)
          }
          try {
            [Convert]::FromBase64String($key) | Out-Null
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY is not valid base64 after whitespace and padding normalization. Re-save the GitHub secret from the Tauri signer output."
          }
          Write-Output "::add-mask::$key"
          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install packaged backend dependencies
        run: npm --prefix backend ci

      - name: Set release version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run release:set-version -- ${{ github.event.inputs.version }}

      - name: Verify updater safety gates
        run: npm run verify:update-safety
        env:
          FROOZERP_REQUIRE_UPDATER_KEY: "1"

      - name: Build Windows installer and updater signature
        run: npm run build:windows

      - name: Copy release artifacts
        run: npm run release:windows

      - name: Generate updater manifest
        run: npm run release:manifest -- ${{ github.event.inputs.channel || 'stable' }}

      - name: Upload signed release candidate for installed-app verification
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish != true) || (github.event_name == 'push' && github.ref_type == 'branch') }}
        uses: actions/upload-artifact@v4
        with:
          name: FroozERP-Windows-RC-${{ github.event.inputs.version || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/windows/FroozERP-Setup-*.exe
            release/windows/FroozERP-Setup-*.exe.sig
            release/windows/latest*.json

      - name: Upload GitHub release assets
        if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || inputs.publish == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          draft: false
          prerelease: ${{ (github.event.inputs.channel || 'stable') == 'beta' }}
          files: |
            release/windows/FroozERP-Setup-*.exe
            release/windows/FroozERP-Setup-*.exe.sig
            release/windows/latest*.json
