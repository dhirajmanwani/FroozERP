name: Release FroozERP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Emergency manual installer version. Normal releases use Windows updater release."
        required: true

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install backend dependencies
        run: npm --prefix backend ci --omit=dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build emergency manual installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: "FroozERP v${{ github.event.inputs.version }} emergency manual installer"
          releaseBody: "Emergency manual installer only. The canonical owner update asset is FroozERP-Setup-${{ github.event.inputs.version }}.exe from the Windows updater release workflow."
          releaseDraft: false
          prerelease: false
